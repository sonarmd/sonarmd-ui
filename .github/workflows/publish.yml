name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Match the org-wide runner standard set by sonarmd/workflows ci-core
    # (PR #48): arm64 native, no cross-arch emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sonarmd'

      # Yarn 4 is pinned in package.json "packageManager"; Corepack ships with
      # the Node version resolved above and activates that exact version.
      - run: corepack enable

      - run: yarn install --immutable

      # Publishing stays on `npm publish` deliberately: the setup-node step
      # above writes the GitHub Packages registry and NODE_AUTH_TOKEN into an
      # .npmrc, which Yarn 4 does not read. Installing with Yarn and
      # publishing with npm keeps the registry, authentication and published
      # artifact byte-for-byte unchanged. npm still runs the package's
      # prepare/prepublishOnly hooks, which build dist before packing.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
