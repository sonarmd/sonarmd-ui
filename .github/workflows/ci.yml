name: CI

# Self-contained quality gate for the @sonarmd/ui package (the precedented shape
# for published-package repos in this org - see agora, smeta - rather than the
# sonarmd/workflows service orchestrator, which is for deployable services).
# Release-blocking: typecheck, tests (incl. tree-shaking reachability + token
# completeness), build, size budgets, and the benchmark budget gate. publish.yml
# owns publishing (installs with Yarn 4, publishes with `npm publish`).

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Typecheck, test, build, size, benchmarks
    # arm64 native, matching the org runner standard used by publish.yml.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # Yarn 4 is pinned in package.json "packageManager"; Corepack ships with
      # the Node version above and activates that exact version.
      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn run typecheck

      - name: Typecheck recipes and doc stories
        run: yarn tsc --noEmit -p tsconfig.recipes.json

      - name: Test (includes tree-shaking reachability + token completeness)
        run: yarn run test

      - name: Build
        run: yarn run build

      - name: Size budgets
        run: yarn run size

      - name: Benchmarks - install
        working-directory: benchmarks
        run: yarn install --immutable

      - name: Benchmarks - measure
        working-directory: benchmarks
        run: yarn run measure

      - name: Benchmarks - budget gate
        working-directory: benchmarks
        run: yarn run check

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/report.md
            benchmarks/results/results.json
          if-no-files-found: warn
