# Yarn 4 (Berry) configuration for @sonarmd/ui.
#
# nodeLinker: node-modules keeps the repository's existing node_modules layout.
# Yarn 4 defaults to Plug'n'Play, which this toolchain does not support:
# size-limit bundles dist against a real node_modules tree, and Ladle,
# vite-plugin-dts and the benchmark harness all resolve the same way.
#
# enableGlobalCache stores package archives outside the repository, so
# .yarn/cache is never created or committed (no zero-installs). Lockfile
# enforcement in CI comes from `yarn install --immutable`, not from a
# committed cache.
#
# enableScripts: true restores npm's behavior of running dependency install
# scripts. Yarn 4 defaults this to false; that default is a dependency-script
# policy change, which is out of scope for a package-manager migration. Any
# change to it belongs in its own reviewed change.
nodeLinker: node-modules
enableGlobalCache: true
enableScripts: true
