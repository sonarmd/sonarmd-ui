# Yarn 4 (Berry) configuration for the benchmark harness.
#
# benchmarks/ is a deliberately separate Yarn project, not a workspace of the
# root package: making it a workspace would hoist MUI, Ant Design and
# Bootstrap into the root node_modules, breaking the isolation the harness
# depends on and creating phantom-import risk against the library's
# zero-runtime-dependency guardrail.
#
# nodeLinker, enableGlobalCache and enableScripts mirror the root
# configuration; the apps under apps/* are plain Vite projects that resolve
# through node_modules.
nodeLinker: node-modules
enableGlobalCache: true
enableScripts: true
